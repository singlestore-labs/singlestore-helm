{{- if .Values.sysreqDaemonSet.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: singlestore-sysreq
  labels:
    app.kubernetes.io/name: singlestore-sysreq
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: singlestore-sysreq
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: singlestore-sysreq
    spec:
      nodeSelector:
{{ toYaml .Values.sysreqDaemonSet.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.sysreqDaemonSet.tolerations | indent 8 }}
      hostPID: true
      volumes:
        - name: sys
          hostPath:
            path: /sys
      initContainers:
        - name: sysreq
          image: busybox
          securityContext:
            privileged: true
          volumeMounts:
            - name: sys
              mountPath: /rootfs/sys
          command:
            - /bin/sh
            - -c
            - |
              set -euxo pipefail
              sysctl -w vm.max_map_count=1000000000
              # Calculate min_free_kbytes: 1% of RAM (in kB) or 4GB (4194304 kB), whichever is smaller
              RAM_KB=$(( {{ .Values.sysreqDaemonSet.ramGB | int }} * 1024 * 1024 ))
              MIN_FREE_KB=$(( RAM_KB / 100 ))
              if [ $MIN_FREE_KB -gt 4194304 ]; then MIN_FREE_KB=4194304; fi
              sysctl -w vm.min_free_kbytes=$MIN_FREE_KB
              echo never > /rootfs/sys/kernel/mm/transparent_hugepage/enabled
              echo never > /rootfs/sys/kernel/mm/transparent_hugepage/defrag
              echo 0 > /rootfs/sys/kernel/mm/transparent_hugepage/khugepaged/defrag
      containers:
        - name: pause
          image: gcr.io/google_containers/pause
{{- end}}